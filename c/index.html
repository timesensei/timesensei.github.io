<script>
// Safari's Smart App Banner: with the app installed it shows OPEN, which hands
// the app this target through the same timesensei:///?target= link the button
// uses. Written while the head is still being parsed, because Safari reads the
// tag at load.
(function () {
  var t = new URLSearchParams(location.search).get('target') || '';
  var arg = /^\d{1,2}\.\d{3}$/.test(t) ? ', app-argument=timesensei:///?target=' + t : '';
  document.write('<meta name="apple-itunes-app" content="app-id=6788348852' + arg + '" />');
})();
</script>

<style>
  :root {

  * { box-sizing: border-box; }
  body {

    align-items: center;
    justify-content: center;

  .mark { display: block; width: 72px; height: 72px; border-radius: 23%; margin-bottom: 1.4rem; }
  .eyebrow { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); margin: 0 0 0.8rem; }
  h1 { font-family: var(--mono); font-weight: 400; font-size: clamp(1.9rem, 7vw, 2.6rem); letter-spacing: -0.02em; color: var(--ink); margin: 0 0 0.8rem; line-height: 1.15; }
  .lede { margin: 0 0 1.8rem; }
  .code { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 1.1rem 1.2rem 1rem; margin: 0 0 1.2rem; text-align: center; }
  .code .k { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.2em; color: var(--ink-3); display: block; }
  .code .v { font-family: var(--mono); font-size: clamp(2.2rem, 11vw, 3rem); letter-spacing: 0.22em; color: var(--ink); display: block; margin: 0.2rem 0 0.4rem; padding-left: 0.22em; }
  .code button { font: inherit; font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; background: transparent; color: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 0.4rem 0.9rem; cursor: pointer; }
  .code button:hover, .code button:focus-visible { border-color: var(--accent); color: var(--accent); }
  .btns { display: flex; flex-direction: column; gap: 0.6rem; margin: 0 0 1.4rem; }
  .btns a { display: block; text-align: center; font-family: var(--mono); font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; border-radius: 10px; padding: 0.95rem 1rem; }
  .btns .p { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btns .h { border: 1px solid var(--line); color: var(--ink); }
  .btns .h:hover, .btns .h:focus-visible { border-color: var(--accent); color: var(--accent); }
  .steps { font-size: 0.92rem; color: var(--ink-3); margin: 0; }
  .note { font-size: 0.92rem; color: var(--ink); border: 1px solid var(--accent); border-radius: 10px; padding: 0.8rem 1rem; margin: 0 0 1rem; }
  [hidden] { display: none !important; }
