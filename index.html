<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Time Sensei</title>
<!-- GitHub Pages can't redirect server-side, so this is the whole page: it
     forwards to a language and links them all, which keeps it correct with
     JavaScript off. Every real page lives under a language directory — the
     root is a doorway, not a copy of any of them. -->
<link rel="canonical" href="https://timesensei.github.io/en/" />
<meta http-equiv="refresh" content="0; url=en/" />
<style>
  body { margin:0; background:#100505; color:#c89880;
         font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
         display:flex; min-height:100vh; align-items:center; justify-content:center;
         text-align:center; }
  p { max-width: 36rem; padding: 0 1.25rem; line-height: 2.2; }
  a { color:#f97316; padding:0 .35rem; white-space:nowrap; }
</style>
</head>
<body>
  <p><a href="en/">English</a> · <a href="tr/">Türkçe</a> · <a href="es/">Español</a> · <a href="pt/">Português</a> · <a href="fr/">Français</a> · <a href="de/">Deutsch</a> · <a href="it/">Italiano</a> · <a href="ru/">Русский</a> · <a href="id/">Bahasa Indonesia</a> · <a href="ja/">日本語</a> · <a href="ko/">한국어</a> · <a href="zh/">中文</a></p>
  <script>
    // Forward to the visitor's own language when we publish it, else leave the
    // meta refresh above to take them to English.
    var offered = ['tr','es','pt','fr','de','it','ru','id','ja','ko','zh'];
    var lang = (navigator.language || '').toLowerCase().split('-')[0];
    if (offered.indexOf(lang) !== -1) location.replace(lang + '/');
  </script>
</body>
</html>
