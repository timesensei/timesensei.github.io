<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Time Sensei</title>
<!-- GitHub Pages can't redirect server-side, so this is the whole page: it
     forwards to a language and links both, which keeps it correct with
     JavaScript off. Every real page lives under /en/ or /tr/ — the root is a
     doorway, not a copy of either. -->
<link rel="canonical" href="https://timesensei.github.io/en/" />
<meta http-equiv="refresh" content="0; url=en/" />
<style>
  body { margin:0; background:#100505; color:#c89880;
         font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
         display:flex; min-height:100vh; align-items:center; justify-content:center; }
  a { color:#f97316; padding:0 .6rem; }
</style>
</head>
<body>
  <p><a href="en/">English</a> · <a href="tr/">Türkçe</a></p>
  <script>
    if ((navigator.language || '').toLowerCase().startsWith('tr')) location.replace('tr/');
  </script>
</body>
</html>
